[colors.primary]
background = '#2d2a2e'
foreground = '#fcfcfa'

[colors.normal]
black =   '#2d2a2e'
red =     '#ff6188'
green =   '#a9dc76'
yellow =  '#ffd866'
blue =    '#fc9867'
magenta = '#ab9df2'
cyan =    '#78dce8'
white =   '#fcfcfa'

[colors.bright]
black =   '#727072'
red =     '#ff6188'
green =   '#a9dc76'
yellow =  '#ffd866'
blue =    '#fc9867'
magenta = '#ab9df2'
cyan =    '#78dce8'
white =   '#fcfcfa'

[colors.cursor]
text = '#2d2a2e'
cursor = '#fcfcfa'

[colors.selection]
text = '#2d2a2e'
background = '#fcfcfa'

[font]
builtin_box_drawing = true
size = 13

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window]
opacity = 1.0
# Add space (in pixels) between the text and the window edge
padding = { x = 15, y = 15 }

[keyboard]
bindings = [
    { key = "F11", action = "ToggleFullscreen" }
]

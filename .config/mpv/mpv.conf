# --- Video Output ---
# Uses a high-quality rendering profile tailored for dedicated GPUs
profile=gpu-hq
vo=gpu

# --- Hardware Decoding for NVIDIA ---
# Forces mpv to use NVIDIA's specific hardware decoder (NVDEC)
hwdec=nvdec
hwdec-codecs=all

# --- GPU API ---
# Vulkan generally performs much better on modern Linux/Wayland than OpenGL
gpu-api=vulkan

# --- Window Behavior (Optional but recommended) ---
keep-open=yes
autofit-larger=100%x100%

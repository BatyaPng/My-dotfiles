set -g mouse on
set -s set-clipboard on

# Wayland (Fedora KDE) or X11 (work PC); on the work PC xclip resolves to the ~/.local/bin wrapper
if-shell '[ -n "$WAYLAND_DISPLAY" ]' \
    "set -s copy-command 'wl-copy'" \
    "set -s copy-command 'xclip -selection clipboard'"
# Forward OSC 52 from panes (incl. ssh sessions) to Alacritty -> Wayland clipboard
set -as terminal-features ",alacritty:clipboard"

set-option -g renumber-windows on

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g default-terminal "xterm-256color"
set -as terminal-overrides ",*:Tc"

set -g focus-events on


# prefix + r: source ~/.bashrc in every bash pane of every window/session
bind r run-shell 'for p in $(tmux list-panes -a -f "##{==:##{pane_current_command},bash}" -F "##{pane_id}"); do tmux send-keys -t "$p" "source ~/.bashrc" Enter; done' \; display-message "Sourced ~/.bashrc in all bash panes"

# ctrl+z suspends Claude Code and its keybindings.json cannot unbind it: swallow C-z in
# claude panes, pass it through everywhere else (job control in bash, vim, ...)
bind -n C-z if -F '#{==:#{pane_current_command},claude}' 'display-message "C-z ignored in Claude Code"' 'send-keys C-z'

set -g status-style bg=purple,fg=black
